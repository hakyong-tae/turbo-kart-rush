<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15161a" />
    <title>Drift Kart</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' font-family='sans-serif' font-weight='800' fill='%23ffd400'%3EK%3C/text%3E%3C/svg%3E" />
    <!-- Display type: Impact where it is installed (desktops), else Anton — phones have no Impact, and without a
         fallback the English UI dropped to the thin system face. Hangul: Black Han Sans (display) + Noto Sans KR (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="/src/styles/index.css" />
    <!-- The first thing on screen, before any script has run: the wordmark and a moving bar.
         The game's code is over a megabyte and takes seconds to start on a slow device; this is
         what a player sees for those seconds instead of a blank page. Everything it needs is in
         this file. src/ui/bootSplash.ts takes it away once the game has something to show.
         The name is written here as it is in src/core/platform.ts: change both together. -->
    <style>
      #boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#15161a;transition:opacity .25s ease-out}
      #boot.gone{opacity:0;pointer-events:none}
      #boot .boot-logo{display:inline-flex;flex-direction:column;align-items:stretch;font-size:clamp(34px,6.2vw,84px)}
      #boot .boot-line{display:flex;align-items:center;gap:.2em;line-height:.92}
      #boot .boot-word{font-family:'Impact','Haettenschweiler','Anton','Arial Narrow Bold','Arial Black',system-ui,sans-serif;font-style:italic;letter-spacing:.01em;color:#fff;white-space:nowrap}
      #boot .boot-plate{display:inline-flex;align-items:center;justify-content:center;font-family:'Impact','Haettenschweiler','Anton','Arial Narrow Bold','Arial Black',system-ui,sans-serif;font-style:italic;font-size:.7em;line-height:1;height:1.16em;padding:0 .26em 0 .2em;background:#ffd400;color:#111;border:.045em solid #111;border-radius:2px}
      #boot .boot-checker{--sq:.07em;height:calc(var(--sq)*2);margin-top:.14em;background-image:repeating-linear-gradient(90deg,#fff 0 var(--sq),#15161a var(--sq) calc(var(--sq)*2)),repeating-linear-gradient(90deg,#15161a 0 var(--sq),#fff var(--sq) calc(var(--sq)*2));background-size:100% 50%;background-position:0 0,0 100%;background-repeat:no-repeat}
      #boot .boot-track{width:min(60vw,360px);height:6px;margin-top:34px;background:#26282f;overflow:hidden}
      #boot .boot-bar{width:34%;height:100%;background:#ffd400;animation:boot-run 1.1s cubic-bezier(.45,0,.55,1) infinite}
      @keyframes boot-run{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-logo">
        <div class="boot-line"><span class="boot-word">DRIFT</span><span class="boot-plate">KART</span></div>
        <div class="boot-checker"></div>
      </div>
      <div class="boot-track"><div class="boot-bar"></div></div>
    </div>
    <div id="app"></div>
    <script>
      // Storage shim — must run BEFORE the module bundle.
      //
      // @agent8/gameserver reads window.localStorage in a module static initializer, so the read
      // happens while the bundle is evaluating, before any of our code exists. When a browser
      // denies storage to this frame — third-party site data turned off, a locked-down WebView,
      // an embedder with an opaque origin — that read THROWS, the whole bundle fails to evaluate,
      // and the player gets a blank page instead of a game they could have played offline.
      //
      // Merely accessing the property is what throws, so it cannot be caught downstream. We probe
      // it once here and, if it is denied, install an in-memory stand-in with the same surface.
      // Nothing is persisted in that case, which is the correct degradation: settings and local
      // best times last for the session, and the server layer reports itself unreachable.
      (function () {
        try {
          var probe = window.localStorage;
          probe.setItem('__tkr_probe__', '1');
          probe.removeItem('__tkr_probe__');
          return;
        } catch (err) {
          console.warn('[tkr] localStorage unavailable, using in-memory storage:', err && err.message);
        }
        var mem = Object.create(null);
        var shim = {
          getItem: function (k) {
            return Object.prototype.hasOwnProperty.call(mem, String(k)) ? mem[String(k)] : null;
          },
          setItem: function (k, v) {
            mem[String(k)] = String(v);
          },
          removeItem: function (k) {
            delete mem[String(k)];
          },
          clear: function () {
            mem = Object.create(null);
          },
          key: function (i) {
            var keys = Object.keys(mem);
            return i >= 0 && i < keys.length ? keys[i] : null;
          },
        };
        Object.defineProperty(shim, 'length', {
          get: function () {
            return Object.keys(mem).length;
          },
        });
        for (var name of ['localStorage', 'sessionStorage']) {
          try {
            Object.defineProperty(window, name, { value: shim, configurable: true, writable: false });
          } catch (err) {
            console.warn('[tkr] could not install the ' + name + ' shim:', err && err.message);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
